<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveStatus Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        utama: '#2563eb',
                        gelap: '#111827',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .aspect-ratio-9-16 { aspect-ratio: 9 / 16; }
        }
    </style>
</head>

<!-- ✅ Tambah pb-20 biar konten gak ketutupan nav bawah -->

<body class="bg-gray-50 dark:bg-gelap text-gray-800 dark:text-gray-200 min-h-screen pb-20">

    <!-- NAVIGASI ATAS -->
    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-gelap/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 mb-6 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">✨ SaveStatus Pro</h1>
            <!-- TOMBOL PROFIL / LOGIN -->
            <button id="btnProfil" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition relative">
                <i class="fa fa-user-circle text-xl"></i>
                <!-- TANDA LOGIN DIUBAH JADI TULISAN -->
                <span id="tandaLogin"
                    class="absolute -top-2 -right-6 text-xs font-bold text-green-500 hidden">AKTIF</span>
            </button>
        </div>
    </header>

    <!-- ✅ MODAL LOGIN / DAFTAR / PROFIL -->
    <div id="modalProfil"
        class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md transform transition-all scale-95 opacity-0"
            id="kotakModal">
            <!-- JUDUL MODAL -->
            <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center">
                <h3 id="judulModal" class="text-lg font-bold">Masuk / Daftar</h3>
                <button id="tutupModal"
                    class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xl">✕</button>
            </div>
            <!-- ISI MODAL: FORM LOGIN / DAFTAR -->
            <div id="isiForm" class="p-4 space-y-4">
                <!-- FORM LOGIN -->
                <div id="formLogin" class="">
                    <div>
                        <label class="text-sm font-medium">Email</label>
                        <input type="email" id="emailLogin" placeholder="nama@email.com"
                            class="w-full mt-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-utama outline-none">
                    </div>
                    <div>
                        <label class="text-sm font-medium">Kata Sandi</label>
                        <input type="password" id="passLogin" placeholder="Masukkan kata sandi"
                            class="w-full mt-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-utama outline-none">
                    </div>
                    <button id="btnMasuk"
                        class="w-full bg-utama hover:bg-utama/90 text-white py-2 rounded-lg font-semibold transition">Masuk</button>
                    <p class="text-center text-sm text-gray-500">Belum punya akun? <a href="#" id="keDaftar"
                            class="text-utama hover:underline">Daftar di sini</a></p>
                </div>
                <!-- FORM DAFTAR -->
                <div id="formDaftar" class="hidden">
                    <div>
                        <label class="text-sm font-medium">Email</label>
                        <input type="email" id="emailDaftar" placeholder="nama@email.com"
                            class="w-full mt-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-utama outline-none">
                    </div>
                    <div>
                        <label class="text-sm font-medium">Kata Sandi</label>
                        <input type="password" id="passDaftar" placeholder="Minimal 6 karakter"
                            class="w-full mt-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-utama outline-none">
                    </div>
                    <button id="btnBuatAkun"
                        class="w-full bg-utama hover:bg-utama/90 text-white py-2 rounded-lg font-semibold transition">Buat
                        Akun</button>
                    <p class="text-center text-sm text-gray-500">Sudah punya akun? <a href="#" id="keLogin"
                            class="text-utama hover:underline">Masuk di sini</a></p>
                </div>
                <!-- MENU SAAT SUDAH LOGIN -->
                <div id="menuProfil" class="hidden text-center space-y-3">
                    <div class="w-16 h-16 bg-utama/10 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fa fa-user text-2xl text-utama"></i>
                    </div>
                    <p id="emailPengguna" class="font-medium"></p>
                    <hr class="dark:border-gray-700">
                    <button
                        class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition">⭐
                        Koleksi Favorit</button>
                    <button
                        class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition">⚙️
                        Pengaturan</button>
                    <button id="btnKeluar"
                        class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-semibold mt-2 transition">Keluar</button>
                </div>
                <!-- PESAN NOTIFIKASI -->
                <div id="pesanAkun" class="text-sm text-center hidden p-2 rounded-lg"></div>
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <main class="container mx-auto px-4 py-6">

        <!-- FITUR SIMPAN STORY -->
        <section
            class="mb-8 bg-white dark:bg-gray-800 rounded-xl shadow p-4 border border-gray-100 dark:border-gray-700">
            <h2 class="text-xl font-bold mb-3">🔗 Simpan Story WA / IG</h2>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="linkInput" placeholder="Tempel link story di sini..."
                    class="flex-1 px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-utama">
                <button id="btnCek"
                    class="bg-utama hover:bg-utama/90 text-white px-4 py-2 rounded-lg font-semibold w-full sm:w-auto transition">Unduh</button>
            </div>
        </section>

        <!-- MENU KATEGORI -->
        <section class="mb-8">
            <h2 class="text-xl font-bold mb-3">📂 Koleksi Status</h2>
            <div class="flex gap-3 overflow-x-auto scrollbar-hide pb-2">
                <button data-kategori="semua"
                    class="kategori-btn bg-utama text-white px-4 py-2 rounded-full shadow whitespace-nowrap active">Semua</button>
                <button data-kategori="video"
                    class="kategori-btn bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow whitespace-nowrap hover:bg-utama/10 dark:hover:hover:bg-utama/20 transition">Video</button>
                <button data-kategori="gambar"
                    class="kategori-btn bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow whitespace-nowrap hover:bg-utama/10 dark:hover:hover:bg-utama/20 transition">Gambar</button>
                <button data-kategori="stiker"
                    class="kategori-btn bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow whitespace-nowrap hover:bg-utama/10 dark:hover:hover:bg-utama/20 transition">Stiker</button>
            </div>
        </section>

        <!-- DAFTAR KONTEN -->
        <section>
            <div id="daftarKonten" class="grid grid-cols-2 sm:grid-cols-3 gap-3 md:gap-4">
                <p class="col-span-full text-center text-gray-500 py-10">Memuat konten...</p>
            </div>
        </section>

    </main>

    <!-- ✅ NAVIGASI BAWAH - PERSIS 100% DENGAN HALAMAN PROFIL -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-gelap/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 z-40">
        <div class="flex justify-around py-3">
            <!-- BERANDA (AKTIF) -->
            <a href="index.html" class="flex flex-col items-center text-utama font-medium">
                <i class="fa fa-home text-xl"></i>
                <span class="text-xs">Beranda</span>
            </a>
            <!-- UNGGAH -->
            <a href="upload.html"
                class="flex flex-col items-center text-gray-600 dark:text-gray-400 hover:text-utama transition-colors">
                <i class="fa fa-plus-circle text-xl"></i>
                <span class="text-xs">Unggah</span>
            </a>
            <!-- PROFIL -->
            <a href="profil.html"
                class="flex flex-col items-center text-gray-600 dark:text-gray-400 hover:text-utama transition-colors">
                <i class="fa fa-user text-xl"></i>
                <span class="text-xs">Profil</span>
            </a>
        </div>
    </nav>

    <!-- SCRIPT UTAMA -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>

</html>
