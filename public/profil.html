<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - SaveStatus</title>
    <!-- ✅ URUTAN: 1. TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        utama: '#2563eb',
                        gelap: '#111827',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .aspect-ratio-9-16 { aspect-ratio: 9 / 16; }
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gelap text-gray-800 dark:text-gray-200 min-h-screen pb-20">

    <!-- Navbar -->
    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-gelap/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 mb-6">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">Profil</h1>
            <a href="index.html" class="text-sm hover:text-utama"><i class="fa fa-home text-lg"></i></a>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-4xl">

        <!-- ✅ BAGIAN INFORMASI PROFIL -->
        <section class="mb-8">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <!-- FOTO PROFIL -->
                <div class="relative">
                    <img id="fotoProfil"
                        src="https://ui-avatars.com/api/?name=Admin+SaveStatus&background=2563eb&color=fff&size=120"
                        alt="Foto Profil"
                        class="w-24 h-24 md:w-32 md:h-32 rounded-full object-cover border-4 border-utama shadow-lg">
                </div>

                <!-- INFO PENGGUNA -->
                <div class="text-center md:text-left flex-1">
                    <h2 id="namaPengguna" class="text-2xl font-bold mb-2">Admin SaveStatus</h2>

                    <!-- STATISTIK: POST | FOLLOWER | LIKE -->
                    <div class="flex justify-center md:justify-start gap-6 mb-3">
                        <div>
                            <span id="jumlahPost" class="block text-xl font-bold">0</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Konten</span>
                        </div>
                        <div>
                            <span id="jumlahFollower" class="block text-xl font-bold">0</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Pengikut</span>
                        </div>
                        <div>
                            <span id="jumlahLike" class="block text-xl font-bold">0</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400">Disukai</span>
                        </div>
                    </div>

                    <p id="bioProfil" class="text-sm text-gray-600 dark:text-gray-300 max-w-md">
                        📢 Bagikan video & foto keren di sini. Semua konten saya simpan aman!
                    </p>
                </div>
            </div>
        </section>

        <!-- ✅ MENU TAB: KONTEN SAYA / DISUKAI / ARSIP -->
        <section class="border-b border-gray-200 dark:border-gray-800 mb-4">
            <div class="grid grid-cols-3 gap-2 text-center">
                <button class="tab-aktif py-2 border-b-2 border-utama font-medium text-utama" data-target="kontenSaya">
                    <i class="fa fa-th-large mr-1"></i> Konten
                </button>
                <button class="py-2 text-gray-500 dark:text-gray-400 hover:text-utama" data-target="kontenDisukai">
                    <i class="fa fa-heart-o mr-1"></i> Disukai
                </button>
                <button class="py-2 text-gray-500 dark:text-gray-400 hover:text-utama" data-target="kontenArsip">
                    <i class="fa fa-bookmark-o mr-1"></i> Arsip
                </button>
            </div>
        </section>

        <!-- ✅ DAFTAR KONTEN (GRID KAYAK TIKTOK) -->
        <section id="kontenSaya" class="grid grid-cols-3 gap-2 md:gap-4">
            <!-- TEMPLATE KONTEN -->
            <!-- <a href="#" class="aspect-ratio-9-16 bg-gray-200 dark:bg-gray-800 rounded-lg overflow-hidden relative group">
                <img src="..." class="w-full h-full object-cover">
                <div class="absolute bottom-1 left-1 text-white text-xs flex items-center">
                    <i class="fa fa-play mr-1"></i> 1.2rb
                </div>
            </a> -->
        </section>

        <section id="kontenDisukai" class="hidden grid grid-cols-3 gap-2 md:gap-4">
            <div class="col-span-3 text-center py-10 text-gray-500">Belum ada konten disukai</div>
        </section>

        <section id="kontenArsip" class="hidden grid grid-cols-3 gap-2 md:gap-4">
            <div class="col-span-3 text-center py-10 text-gray-500">Belum ada arsip</div>
        </section>

        <!-- LOADING -->
        <div id="loadingProfil" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-utama"></div>
            <p class="text-sm mt-2 text-gray-500">Memuat konten...</p>
        </div>

        <!-- PESAN KOSONG -->
        <div id="kosongProfil" class="hidden text-center py-16 text-gray-500 dark:text-gray-400">
            <i class="fa fa-video-camera text-5xl mb-3 opacity-30"></i>
            <p>Belum ada konten yang diposting</p>
            <a href="upload.html" class="inline-block mt-3 bg-utama text-white px-4 py-2 rounded-lg text-sm">Unggah
                Sekarang</a>
        </div>

    </main>

    <!-- NAVIGASI BAWAH -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-gelap/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 z-40">
        <div class="flex justify-around py-3">
            <a href="index.html" class="flex flex-col items-center text-gray-600 dark:text-gray-400 hover:text-utama">
                <i class="fa fa-home text-xl"></i>
                <span class="text-xs">Beranda</span>
            </a>
            <a href="upload.html" class="flex flex-col items-center text-gray-600 dark:text-gray-400 hover:text-utama">
                <i class="fa fa-plus-circle text-xl"></i>
                <span class="text-xs">Unggah</span>
            </a>
            <a href="profil.html" class="flex flex-col items-center text-utama font-medium">
                <i class="fa fa-user text-xl"></i>
                <span class="text-xs">Profil</span>
            </a>
        </div>
    </nav>

    <!-- ✅ URUTAN SCRIPT WAJIB BEGINI: -->
    <!-- 1. PUSTAKA SUPABASE DULUAN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. BARU AUTH.JS (BIAR BISA BACA PUSTAKANYA) -->
    <script src="auth.js"></script>

    <!-- 3. PROTEKSI: CEK DULU SEBELUM JALAN LAIN -->
    <script>
        wajibLogin(); // <--- DIJALANKAN PALING AWAL, TANPA DIBUNGKUS APA-APA
    </script>

    <!-- 4. TERAKHIR: LOGIKA HALAMAN PROFIL -->
    <script src="profil.js"></script>

</body>

</html>
