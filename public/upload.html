<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Konten - SaveStatus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        utama: '#2563eb',
                        gelap: '#111827',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
        }
    </style>
</head>

<!-- ✅ Tambah pb-20 biar konten gak ketutupan nav bawah -->

<body class="bg-gray-50 dark:bg-gelap text-gray-800 dark:text-gray-200 min-h-screen pb-20">

    <!-- Navbar Sederhana -->
    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-gelap/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 mb-6 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold text-utama">📤 Upload Konten Baru</h1>
            <a href="index.html" class="text-sm hover:text-utama transition">← Kembali ke Beranda</a>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container mx-auto px-4 pb-10 max-w-2xl">

        <!-- KARTU FORM UPLOAD -->
        <div
            class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 md:p-8 border border-gray-100 dark:border-gray-700">

            <!-- PESAN NOTIFIKASI -->
            <div id="pesanUpload" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

            <form id="formUpload" class="space-y-6">

                <!-- PILIH KATEGORI -->
                <div>
                    <label class="block text-sm font-medium mb-2">Kategori Konten</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="tipe" value="video" class="peer hidden" checked>
                            <div
                                class="p-3 text-center rounded-lg border-2 border-gray-200 dark:border-gray-700 peer-checked:border-utama peer-checked:bg-utama/10 transition-all hover:border-gray-300 dark:hover:border-gray-600">
                                <i class="fa fa-video-camera text-xl mb-1"></i>
                                <div class="text-xs">Video</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="tipe" value="gambar" class="peer hidden">
                            <div
                                class="p-3 text-center rounded-lg border-2 border-gray-200 dark:border-gray-700 peer-checked:border-utama peer-checked:bg-utama/10 transition-all hover:border-gray-300 dark:hover:border-gray-600">
                                <i class="fa fa-picture-o text-xl mb-1"></i>
                                <div class="text-xs">Gambar</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="tipe" value="stiker" class="peer hidden">
                            <div
                                class="p-3 text-center rounded-lg border-2 border-gray-200 dark:border-gray-700 peer-checked:border-utama peer-checked:bg-utama/10 transition-all hover:border-gray-300 dark:hover:border-gray-600">
                                <i class="fa fa-sticky-note-o text-xl mb-1"></i>
                                <div class="text-xs">Stiker</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- JUDUL KONTEN -->
                <div>
                    <label for="judulInput" class="block text-sm font-medium mb-2">Judul / Nama Konten</label>
                    <input type="text" id="judulInput" placeholder="Contoh: Video Lucu Kucing..."
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-transparent focus:ring-2 focus:ring-utama focus:border-utama outline-none transition">
                </div>

                <!-- INPUT FILE -->
                <div>
                    <label class="block text-sm font-medium mb-2">Pilih File <span id="teksJenisFile">(MP4 /
                            MOV)</span></label>
                    <label for="fileInput"
                        class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fa fa-cloud-upload text-4xl text-utama/60 dark:text-utama/40 mb-3"></i>
                            <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Klik
                                    untuk upload</span> atau seret file ke sini</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Maksimal ukuran: 500MB</p>
                        </div>
                        <input id="fileInput" type="file" class="hidden" />
                    </label>
                    <p id="namaFileTerpilih" class="text-xs mt-2 text-gray-600 dark:text-gray-400"></p>
                </div>

                <!-- PREVIEW GAMBAR/VIDEO -->
                <div id="wadahPreview" class="hidden mt-4">
                    <p class="text-sm font-medium mb-2">Pratinjau:</p>
                    <div
                        class="w-full max-w-xs mx-auto rounded-lg overflow-hidden bg-gray-100 dark:bg-gray-900 min-h-[100px] flex items-center justify-center border border-gray-200 dark:border-gray-700">
                        <img id="previewGambar" class="w-full h-auto object-contain" alt="Preview"
                            style="display: none;">
                        <video id="previewVideo" class="w-full h-auto object-contain" controls playsinline
                            style="display: none; min-height: 150px;"></video>
                    </div>
                </div>

                <!-- PROGRESS BAR -->
                <div id="wadahProgres" class="hidden">
                    <div class="flex justify-between text-sm mb-1">
                        <span>Proses Upload...</span>
                        <span id="persenProgres">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 overflow-hidden">
                        <div id="barProgres"
                            class="bg-utama h-2.5 rounded-full w-0 transition-all duration-300 ease-out"></div>
                    </div>
                </div>

                <!-- TOMBOL KIRIM -->
                <button type="submit" id="btnSubmit"
                    class="w-full bg-utama hover:bg-utama/90 active:bg-utama/80 text-white font-medium py-3 px-4 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg">
                    🚀 Unggah & Simpan ke Database
                </button>

            </form>
        </div>

    </main>

    <!-- ✅ NAVIGASI BAWAH - PERSIS 100% SAMA INDEX & PROFIL -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-gelap/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 z-40">
        <div class="flex justify-around py-3">
            <!-- BERANDA -->
            <a href="index.html"
                class="flex flex-col items-center text-gray-600 dark:text-gray-400 hover:text-utama transition-colors">
                <i class="fa fa-home text-xl"></i>
                <span class="text-xs">Beranda</span>
            </a>
            <!-- UNGGAH (SEDANG AKTIF) -->
            <a href="upload.html" class="flex flex-col items-center text-utama font-medium">
                <i class="fa fa-plus-circle text-xl"></i>
                <span class="text-xs">Unggah</span>
            </a>
            <!-- PROFIL -->
            <a href="profil.html"
                class="flex flex-col items-center text-gray-600 dark:text-gray-400 hover:text-utama transition-colors">
                <i class="fa fa-user text-xl"></i>
                <span class="text-xs">Profil</span>
            </a>
        </div>
    </nav>

    <!-- ✅ URUTAN SCRIPT: PENTING! JANGAN DIURUTKAN SALAH -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script> <!-- ⚠️ WAJIB DI ATAS: PENGATURAN LOGIN -->
    <script src="upload.js"></script> <!-- ⚠️ DI BAWAH: LOGIKA UPLOAD -->

    <!-- ✅ PROTEKSI HALAMAN: DIJALANKAN TERAKHIR -->
    <script>
        // Panggil fungsi proteksi dari auth.js
        if (typeof wajibLogin === 'function') wajibLogin();
    </script>

</body>

</html>
