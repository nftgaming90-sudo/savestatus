<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonton Konten - SaveStatus</title>
    <!-- ✅ CSS YANG BENAR DAN LENGKAP -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        utama: '#2563eb',
                        gelap: '#111827',
                    },
                    backdropBlur: {
                        'xs': '2px',
                        'sm': '4px',
                        'md': '8px',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .scrollbar-hide { 
                -ms-overflow-style: none; 
                scrollbar-width: none; 
            }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .aspect-ratio-9-16 { aspect-ratio: 9 / 16; }
            .scroll-snap-y { scroll-snap-type: y mandatory; }
            .snap-start { scroll-snap-align: start; }
            .line-clamp-2 { 
                display: -webkit-box; 
                -webkit-line-clamp: 2; 
                -webkit-box-orient: vertical; 
                overflow: hidden; 
            }
        }
    </style>
</head>

<body class="bg-black text-white overflow-hidden select-none">

    <!-- ✅ KONTAINER UTAMA: SCROLL VERTIKAL -->
    <main id="daftarKonten" class="h-screen w-full overflow-y-auto scroll-snap-y scrollbar-hide">

        <!-- ⏳ LOADING -->
        <div id="loadingHalaman"
            class="h-screen w-full flex items-center justify-center bg-gelap/90 backdrop-blur-md absolute z-50">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-utama mb-4"></div>
                <p class="text-sm text-gray-300">Memuat konten...</p>
            </div>
        </div>

        <!-- ❌ PESAN GAGAL -->
        <div id="kontenKosong" class="h-screen w-full flex flex-col items-center justify-center bg-gelap hidden">
            <i class="fa fa-exclamation-circle text-5xl text-red-500 mb-4"></i>
            <p class="text-lg mb-2">Konten tidak ditemukan</p>
            <a href="index.html"
                class="mt-2 bg-utama px-5 py-2 rounded-lg text-sm hover:bg-utama/90 transition-all duration-300">Kembali
                ke Beranda</a>
        </div>

        <!-- 🎥 KONTEN AKAN DITAMPILKAN DI SINI OLEH JS -->

    </main>

    <!-- 🔝 TOMBOL KEMBALI -->
    <a href="javascript:history.back()"
        class="absolute top-4 left-4 z-40 w-9 h-9 rounded-full bg-black/20 backdrop-blur-sm flex items-center justify-center hover:bg-black/40 transition-all duration-300">
        <i class="fa fa-arrow-left text-white text-base"></i>
    </a>

    <!-- ⚡ SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="detail.js"></script>
</body>

</html>
